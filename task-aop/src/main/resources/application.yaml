server:
  port: 8080

spring:
  application:
    name: task-aop
  profiles:
    active: secret, kafka

  kafka:
    bootstrap-servers: ${kafka.bootstrap-servers}

  mail:
    host: ${mail.host}
    port: ${mail.port}
    username: ${mail.username}
    password: ${mail.password}
    properties:
      mail:
        smtp:
          auth: true
          starttls.enable: true

  datasource:
    url: jdbc:postgresql://localhost:15432/postgres_task
#    url: jdbc:postgresql://postgres_task:5432/postgres_task
    driverClassName: org.postgresql.Driver
    username: ${postgres.POSTGRES_USER}
    password: ${postgres.POSTGRES_PASSWORD}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
