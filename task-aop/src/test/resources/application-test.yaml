server:
  port: 8080

spring:
  application:
    name: test-task-aop

  datasource:
    url: jdbc:tc:postgresql:latest:///test_task_db
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  mail:
    host:
    port:
    username:
    password:
    properties:
      mail:
        smtp:
          auth:
          starttls.enable:
mail:
  email-recipient: test@mail.ru

kafka:
  max-pull-interval: "100000"
  consumer:
    tasks-update-status:
      topic: tasks-update-status-topic
      group-id: tasks-update-status-group
      auto-offset-reset: earliest
